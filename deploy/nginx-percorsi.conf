# Esempio di reverse proxy con accesso protetto da password.
# Crea il file utenti con:  sudo htpasswd -c /etc/nginx/percorsi.htpasswd mario.rossi
server {
    listen 443 ssl;
    server_name percorsi.azienda.local;

    ssl_certificate     /etc/ssl/certs/percorsi.crt;
    ssl_certificate_key /etc/ssl/private/percorsi.key;

    auth_basic           "Portale percorsi";
    auth_basic_user_file /etc/nginx/percorsi.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        # Streamlit usa i websocket: senza queste righe la pagina resta bianca
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
        # Passa a Streamlit il nome con cui la persona ha fatto login:
        # l'app lo usa come autore delle versioni, senza farlo digitare.
        proxy_set_header X-Remote-User $remote_user;
    }
}
